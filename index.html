<title>堂數點名簿</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ==========================================================
   堂數點名簿 — 樣式（單一層，所有數值都從下面的 token 來）
   規則：
   - 字級只用 --fs-*；圓角只用 --r-*；間距用 4 的倍數；陰影只有 --sh-1 / --sh-2
   - 藍色（--indigo）= 主要動作、選中；紅色（--seal）= 要注意（待補、欠費、刪除）
   - 班級顏色只出現在小色點和頭像，不做整塊色標
   - 數字用內文字體＋等寬數字（tabular-nums），只有家長密碼用等寬字體
   ========================================================== */
:root{
  --paper:#f3f4f7; --card:#ffffff; --ink:#18202e; --ink-2:#5d6779; --ink-3:#8a93a3; --line:#e3e6ec; --soft:#eceef3;
  --indigo:#2b4f86; --indigo-soft:#e5ecf6; --seal:#c93c2f; --amber:#b06d12; --green:#2a7d58; --violet:#6d52aa;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
  --f-num:var(--f-body);
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",monospace;
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:20px; --fs-2xl:28px;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-full:999px;
  --sh-1:0 1px 2px rgb(24 32 46 / .05),0 2px 8px rgb(24 32 46 / .04);
  --sh-2:0 8px 28px rgb(24 32 46 / .14);
  --ease:cubic-bezier(.3,.7,.4,1);
  /* 舊名稱保留，避免程式裡的行內樣式失效 */
  --shadow:var(--sh-1); --glass:var(--card);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e131b; --card:#171e29; --ink:#e5e9f0; --ink-2:#9aa5b5; --ink-3:#6f7a8b; --line:#263040; --soft:#1f2735;
  --indigo:#8aabe0; --indigo-soft:#1e2a3e; --seal:#e7655a; --amber:#e1a447; --green:#5cbf8d; --violet:#a98ee6;
  --sh-1:0 0 0 1px rgb(255 255 255 / .04); --sh-2:0 8px 28px rgb(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e131b; --card:#171e29; --ink:#e5e9f0; --ink-2:#9aa5b5; --ink-3:#6f7a8b; --line:#263040; --soft:#1f2735;
  --indigo:#8aabe0; --indigo-soft:#1e2a3e; --seal:#e7655a; --amber:#e1a447; --green:#5cbf8d; --violet:#a98ee6;
  --sh-1:0 0 0 1px rgb(255 255 255 / .04); --sh-2:0 8px 28px rgb(0 0 0 / .5); color-scheme:dark}

/* ---------- 基本 ---------- */
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-md);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bg{position:fixed;inset:0 0 auto;height:260px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,var(--indigo-soft),transparent)}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2);font-size:var(--fs-sm)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec-title{font-family:var(--f-display);font-size:var(--fs-xl);font-weight:700;margin:8px 0 0;line-height:1.3}

/* ---------- 頁首 ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top>div:first-child{display:flex;flex-direction:column}
header.top h1{font-family:var(--f-display);font-size:var(--fs-2xl);line-height:1.15;margin:0;font-weight:700;letter-spacing:.02em}
header.top .studio{font-size:var(--fs-xs);color:var(--indigo);font-weight:700;letter-spacing:.04em}
.hd-r{display:flex;align-items:center;gap:8px}
.icon-btn,.cloud-ind{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh-1);color:var(--ink-2);position:relative}
.icon-btn svg,.cloud-ind svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.on{color:var(--indigo);background:var(--indigo-soft)}
.seal-mark{width:38px;height:38px;border-radius:var(--r-md);background:var(--seal);color:#fff;font-family:var(--f-display);font-size:22px;font-weight:700;display:grid;place-items:center;transform:rotate(-6deg)}
.cloud-ind::after{content:"";position:absolute;right:6px;bottom:7px;width:8px;height:8px;border-radius:50%;background:var(--ink-3);box-shadow:0 0 0 2px var(--card)}
.cloud-ind[data-st="ok"]::after{background:var(--green)}
.cloud-ind[data-st="syncing"]::after{background:var(--indigo);animation:blink 1s infinite}
.cloud-ind[data-st="offline"]::after,.cloud-ind[data-st="login"]::after{background:var(--amber)}
.cloud-ind[data-st="error"]{color:var(--seal)}.cloud-ind[data-st="error"]::after{background:var(--seal)}
@keyframes blink{50%{opacity:.25}}

/* ---------- 卡片、清單 ---------- */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:var(--fs-xs);color:var(--ink-2)}
.li .r{text-align:right;flex-shrink:0}
.big{font-variant-numeric:tabular-nums;font-size:var(--fs-lg);font-weight:700}
.unit{font-size:var(--fs-xs);color:var(--ink-2);margin-left:2px;font-weight:400}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);font-size:var(--fs-sm)}
.empty b{display:block;font-family:var(--f-display);font-size:var(--fs-lg);color:var(--ink);margin-bottom:4px}
.banner{background:var(--indigo-soft);color:var(--indigo);border-radius:var(--r-md);padding:8px 12px;font-size:var(--fs-sm);margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.banner button{background:none;border:0;color:var(--indigo);font-weight:700;padding:0;white-space:nowrap}
.hint{background:var(--indigo-soft);color:var(--ink);border-radius:var(--r-md);padding:12px;font-size:var(--fs-sm);line-height:1.6}
.hint b{color:var(--indigo)}

/* ---------- 按鈕（只有四種：預設／primary／ghost／danger；大小：預設／sm） ---------- */
.btn{border:0;background:var(--soft);color:var(--ink);border-radius:var(--r-md);padding:10px 16px;font-weight:600;font-size:var(--fs-md);line-height:1.3}
.btn.primary{background:var(--indigo);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e131b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0e131b}}
.btn.ghost{background:none;color:var(--indigo);padding-inline:8px}
.btn.danger{background:color-mix(in srgb,var(--seal) 12%,transparent);color:var(--seal)}
.btn.sm{padding:6px 12px;font-size:var(--fs-sm);border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* ---------- 篩選、分段、標籤 ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);box-shadow:var(--sh-1);border-radius:var(--r-full);padding:6px 14px;font-size:var(--fs-sm);white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);box-shadow:none}
.seg{display:inline-flex;background:var(--soft);border-radius:var(--r-md);padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--sh-1)}
.seg.wide{display:flex}.seg.wide button{flex:1}
/* 狀態小標（pill）：同一種形狀，顏色代表意思 */
.pill,.wa-st{display:inline-block;font-size:var(--fs-xs);border-radius:var(--r-full);padding:1px 8px;font-weight:700;white-space:nowrap;background:var(--soft);color:var(--ink-2);vertical-align:1px}
.pill.plan,.wa-pre{font-weight:500}
.pill.paid,.pill.mkp,.wa-ok{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.pill.unpaid,.wa-todo{background:color-mix(in srgb,var(--seal) 12%,transparent);color:var(--seal)}
.wa-sch{background:var(--indigo-soft);color:var(--indigo)}
/* 班級：小色點＋名稱 */
.lv{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:500;color:var(--ink-2);white-space:nowrap;vertical-align:1px;font-family:var(--f-body)}
.lv::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-3))}
.lv0{--c:var(--amber)}.lv1{--c:var(--green)}.lv2{--c:var(--indigo)}.lv3{--c:var(--violet)}.lv4{--c:var(--seal)}.lv5{--c:var(--ink-3)}
/* 頭像：淡底色＋同色字 */
.av{flex-shrink:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:var(--fs-lg);font-weight:700;color:var(--c,var(--ink-2));background:color-mix(in srgb,var(--c,var(--ink-3)) 15%,var(--card))}
.av0{--c:var(--amber)}.av1{--c:var(--green)}.av2{--c:var(--indigo)}.av3{--c:var(--violet)}.av4{--c:var(--seal)}.av5{--c:var(--ink-2)}
.badge{position:absolute;top:-4px;right:-10px;min-width:18px;height:18px;border-radius:9px;background:var(--seal);color:#fff;font-size:11px;font-variant-numeric:tabular-nums;line-height:18px;text-align:center;padding:0 4px;font-weight:700}
.bal-ok{color:var(--green)}.bal-low{color:var(--amber)}.bal-neg{color:var(--seal)}
.st{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-family:var(--f-display);font-size:var(--fs-sm);font-weight:700;color:#fff}
.st-present{background:var(--indigo)}.st-leave{background:var(--amber)}.st-absent{background:var(--seal)}.st-extra{background:var(--violet)}.st-makeup{background:var(--green)}
.ok-dot{font-style:normal;color:var(--green);font-weight:700;margin-right:3px}
.chip.on .ok-dot{color:inherit}
.dirty-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:5px;vertical-align:1px}
.cl-dot{font-style:normal;font-size:10px;background:var(--ink-3);color:var(--card);border-radius:4px;padding:0 3px;margin-right:4px}

/* ---------- 表單 ---------- */
label.f{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-sm);color:var(--ink-2)}
label.f input,label.f select,label.f textarea,.inp{border:1px solid transparent;background:var(--soft);border-radius:var(--r-md);padding:10px 12px;font-size:16px;color:var(--ink);width:100%}
.inp:focus,label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--indigo);outline-offset:0;background:var(--card)}
.check{display:flex;align-items:center;gap:8px;font-size:var(--fs-md)}
.check input{width:20px;height:20px;accent-color:var(--indigo)}
.opt{display:flex;justify-content:space-between;gap:12px;width:100%;padding:12px;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-md);text-align:left}
.opt span:last-child{color:var(--ink-2);font-size:var(--fs-sm)}
.opt.on{border-color:var(--indigo);background:var(--indigo-soft)}
.opt:disabled{opacity:.45}
.slot-row{display:grid;grid-template-columns:5.2em minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.slot-row .inp{padding:8px}

/* ---------- 點名 ---------- */
.datebar{display:flex;align-items:center;gap:8px}
.datebar .nav{width:44px;height:44px;border-radius:var(--r-md);border:0;background:var(--card);box-shadow:var(--sh-1);font-size:var(--fs-xl);line-height:1}
.datebar .dlabel{flex:1;position:relative;background:var(--card);box-shadow:var(--sh-1);border-radius:var(--r-md);height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-size:var(--fs-lg);font-weight:700}
.datebar .dlabel small{font-weight:400;color:var(--ink-2);font-family:var(--f-body);font-size:var(--fs-sm)}
.datebar .dlabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.today-tag{font-size:11px;background:var(--seal);color:#fff;border-radius:4px;padding:0 5px;font-weight:700;font-family:var(--f-body)}
.tally{display:grid;grid-template-columns:repeat(4,1fr);padding:12px 4px}
.tally.t3{grid-template-columns:repeat(3,1fr)}
.tally div{text-align:center}
.tally b{display:block;font-variant-numeric:tabular-nums;font-size:var(--fs-xl);line-height:1.3}
.tally span{font-size:var(--fs-xs);color:var(--ink-2)}
.roll{padding:2px 0}
.roll-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);transition:background .2s}
.roll-row:first-child{border-top:0}
.roll-row.is-present{background:color-mix(in srgb,var(--indigo) 5%,transparent)}
.roll-row.is-absent{background:color-mix(in srgb,var(--amber) 7%,transparent)}
.who{min-width:0}
.who .nm{font-weight:700;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sub{font-size:var(--fs-xs);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marks{display:flex;gap:8px}
.mk2{position:relative;min-width:54px;height:40px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);font-family:var(--f-display);font-size:var(--fs-md);font-weight:700;color:var(--ink-2);padding:0 12px;touch-action:manipulation;transition:transform .14s var(--ease),background .18s,color .18s}
.mk2:active{transform:scale(.9)}
.mk2.yes.on{background:var(--indigo);border-color:var(--indigo);color:var(--card)}
.mk2.no.on{background:var(--amber);border-color:var(--amber);color:var(--card)}
.mk2:disabled{cursor:default}
.roll.is-locked .mk2{opacity:.55}.roll.is-locked .mk2.on{opacity:1}
.mk2.pop{animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.75)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.confirm-bar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:8px;padding:8px;background:var(--card);box-shadow:var(--sh-2);border-radius:var(--r-lg)}
.confirm-bar .btn{flex:1;padding:12px 10px}
.confirm-bar .btn.primary{flex:1.3;font-weight:700}
.confirmed{display:flex;align-items:center;justify-content:space-between;gap:8px;background:color-mix(in srgb,var(--green) 12%,var(--card));color:var(--green);border-radius:var(--r-md);padding:10px 12px;font-weight:700}
.topic{display:flex;align-items:baseline;gap:12px;padding:10px 16px;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh-1)}
.topic span{font-size:var(--fs-xs);color:var(--ink-2);white-space:nowrap}
.topic b{font-family:var(--f-display);font-size:var(--fs-lg)}
/* 提醒列：一律同一個樣子，左邊數字，右邊動作 */
.remind,.te-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:var(--r-lg);padding:12px 16px;background:var(--card);box-shadow:var(--sh-1);color:var(--ink)}
.remind b{font-variant-numeric:tabular-nums;font-size:var(--fs-xl);color:var(--seal);font-weight:700}
.remind span{flex:1;min-width:0;font-size:var(--fs-sm)}
.remind i,.te-card i{font-style:normal;font-weight:700;color:var(--indigo);white-space:nowrap}
.remind.te b{color:var(--indigo)}
.te-card div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.te-card b{font-family:var(--f-display);font-size:var(--fs-lg)}
.te-card span{font-size:var(--fs-sm);color:var(--ink-2)}
.te-row{align-items:flex-start}
.te-row .r .btn{margin-top:4px}

/* ---------- 學生、類別 ---------- */
.lv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.lv-card{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:3px;row-gap:2px;background:var(--card);box-shadow:var(--sh-1);border:0;border-radius:var(--r-md);padding:10px 12px;text-align:left}
.lv-card .lv{grid-column:1/-1}
.lv-card b{font-size:var(--fs-xl);font-variant-numeric:tabular-nums;line-height:1.2}
.lv-card small{color:var(--ink-2);font-size:var(--fs-xs)}
.lv-card.on{box-shadow:0 0 0 2px var(--indigo);background:var(--indigo-soft)}
.credit-row{font-size:var(--fs-sm);background:var(--soft);border-radius:var(--r-sm);padding:8px 12px}
.report{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.rp-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rp-bal{text-align:center;background:var(--indigo-soft);border-radius:var(--r-lg);padding:8px 16px}

.rp-bal span{font-size:var(--fs-xs);color:var(--ink-2)}
.rp-sec{border-top:1px solid var(--line);padding-top:12px}
.rp-sec h4{margin:0 0 4px;font-family:var(--f-display);font-size:var(--fs-lg)}
.rp-sec p{margin:4px 0}

/* ---------- 調課 ---------- */
.mk-dates{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mk-dates span{font-size:var(--fs-xs);background:var(--soft);color:var(--ink-2);border-radius:var(--r-sm);padding:0 6px;font-variant-numeric:tabular-nums}
.mk-dates span.again{background:color-mix(in srgb,var(--seal) 12%,transparent);color:var(--seal)}
.mk-n{font-variant-numeric:tabular-nums;font-size:var(--fs-xl);font-weight:700;color:var(--seal);line-height:1}
.mk-n small{font-size:var(--fs-xs);color:var(--ink-2);font-weight:400;margin-left:2px}

/* ---------- 數字、表格、圖表 ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);box-shadow:var(--sh-1);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.kpi span{font-size:var(--fs-xs);color:var(--ink-2);display:block}
.kpi b{font-variant-numeric:tabular-nums;font-size:var(--fs-md);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
@media (max-width:420px){.kpi{padding:10px}.kpi b{font-size:14px;letter-spacing:-.01em}}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.tbl th{font-size:var(--fs-xs);font-weight:500;color:var(--ink-2);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:12px}
.tbl td{text-align:center;padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td:first-child{font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.leave-dates{font-size:var(--fs-xs);color:var(--ink-2);font-variant-numeric:tabular-nums;padding:0 12px 10px;line-height:1.7}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;padding:16px 12px 8px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:100%;max-width:34px;background:var(--indigo);border-radius:6px 6px 2px 2px;min-height:2px}
.bar.cur i{background:var(--seal)}
.bar em{font-style:normal;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar span{font-size:var(--fs-xs);color:var(--ink-2)}
.wk-nav{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--ink-2)}
.wk-chart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:16px 10px 10px;height:170px}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%}
.wk-day em{font-style:normal;font-size:var(--fs-sm);font-weight:600;height:18px;font-variant-numeric:tabular-nums}
.wk-bar{flex:1;width:100%;max-width:30px;position:relative}
.wk-bar i{position:absolute;left:0;right:0;bottom:0;border-radius:6px 6px 2px 2px;min-height:2px}
.wk-bar .exp{background:var(--indigo-soft)}.wk-bar .got{background:var(--indigo)}
.wk-day span{font-size:var(--fs-xs);color:var(--ink-2);text-align:center;line-height:1.2}
.wk-day small{font-size:10px}
.wk-day.today span{color:var(--seal);font-weight:700}
.wk-day.fut em{color:var(--ink-2);font-weight:400}
.mo-chart{display:flex;gap:8px;align-items:stretch;height:160px;padding:16px 12px 10px}
.mo-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;border-radius:var(--r-sm)}
.mo-col em{font-style:normal;font-size:var(--fs-xs);font-weight:600;height:16px;font-variant-numeric:tabular-nums}
.mo-bar{flex:1;width:100%;max-width:38px;position:relative}
.mo-bar i{position:absolute;left:0;right:0;bottom:0;border-radius:6px 6px 2px 2px;min-height:2px}
.mo-bar .a{background:color-mix(in srgb,var(--amber) 30%,transparent)}.mo-bar .p{background:var(--indigo)}
.mo-col span{font-size:var(--fs-xs);color:var(--ink-2)}
.mo-col.on span{color:var(--ink);font-weight:700}
.mo-col.on .mo-bar .p{background:var(--seal)}
.wa{padding:4px 0 12px}
.wa-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:10px 16px;text-align:left}
.wa-head b{font-family:var(--f-display);font-size:var(--fs-lg);color:var(--seal)}
.wa-row{align-items:center}
.wa-row .main{cursor:pointer}
.wa-miss{margin:8px 16px 0;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}

.wa-mrow{display:flex;gap:10px;align-items:baseline;border:0;background:var(--soft);border-radius:var(--r-sm);padding:8px 10px;text-align:left;font-size:var(--fs-sm)}

.wa .btn.block{width:calc(100% - 32px);margin-left:16px}

/* ---------- 雲端狀態 ---------- */

.cloud-st[data-st="error"]{background:color-mix(in srgb,var(--seal) 10%,transparent)}.cloud-st[data-st="error"] b{color:var(--seal)}
.cloud-st[data-st="offline"]{background:color-mix(in srgb,var(--amber) 12%,transparent)}.cloud-st[data-st="offline"] b{color:var(--amber)}
.cloud-st[data-st="syncing"] b{color:var(--indigo)}

/* ---------- 作品 ---------- */
.wk-group{display:flex;flex-direction:column;gap:8px}
.wk-group .row{align-items:baseline}
.wk-group b{font-family:var(--f-display);font-size:var(--fs-lg)}
.wk-grid,.wk-rv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wk-rv{max-height:52vh;overflow:auto}
@media (min-width:520px){.wk-grid,.wk-rv{grid-template-columns:repeat(4,1fr)}}
.wk-th{position:relative;border:0;padding:0;background:var(--soft);border-radius:var(--r-md);overflow:hidden;aspect-ratio:1}
.wk-th img{width:100%;height:100%;object-fit:contain;display:block}
.wk-th i{position:absolute;left:6px;bottom:6px;font-style:normal;font-size:10px;font-weight:700;background:var(--seal);color:#fff;border-radius:4px;padding:0 5px}

.wk-th.warn{outline:2px solid var(--amber);outline-offset:-2px}
.wk-prog{height:8px;border-radius:var(--r-full);background:var(--soft);overflow:hidden;margin:16px 0}
.wk-prog i{display:block;height:100%;width:0;background:var(--indigo);transition:width .2s}
.wk-full{display:block;width:100%;max-height:62vh;object-fit:contain;background:var(--soft);border-radius:var(--r-md);margin-top:10px}
.wk-code{font-family:var(--f-mono);font-size:var(--fs-2xl);letter-spacing:.12em;text-align:center;padding:16px;border-radius:var(--r-lg);background:var(--indigo-soft);color:var(--indigo);font-weight:600;-webkit-user-select:all;user-select:all}
.wk-dest{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;padding:8px 12px;border-radius:var(--r-md);background:var(--soft);font-size:var(--fs-sm)}
.wk-dest>span:first-child{color:var(--ink-2)}
.crop{position:relative;margin:0 auto;touch-action:none;-webkit-user-select:none;user-select:none;border-radius:var(--r-sm);background:var(--soft)}
.crop canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:var(--r-sm)}
.crop svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}

.crop-h{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--seal);border:3px solid #fff;box-shadow:0 1px 5px rgb(0 0 0 / .5);pointer-events:none}
.loupe{position:absolute;width:112px;height:112px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:var(--sh-2);pointer-events:none;z-index:2;top:8px;left:8px}
.loupe[hidden]{display:none}
.loupe canvas{position:static;width:100%;height:100%;border-radius:0}

/* ---------- 底部分頁（5 個；正式版關掉作品時 4 個） ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 -1px 0 var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-2);padding:4px 0;min-width:0;touch-action:manipulation}
nav.tabs .ic{position:relative;display:grid;place-items:center;width:44px;height:28px;border-radius:var(--r-full);transition:background .15s}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--indigo);font-weight:700}
nav.tabs button.on .ic{background:var(--indigo-soft)}

/* ---------- 彈出面板、提示 ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgb(10 16 28 / .4);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{background:var(--card);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));animation:up .22s var(--ease)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--f-display);font-size:var(--fs-xl);margin:0 0 12px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:var(--r-full);font-size:var(--fs-sm);z-index:60;white-space:nowrap;box-shadow:var(--sh-2);animation:toast .25s var(--ease)}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.stamp{position:fixed;inset:0;z-index:80;display:grid;place-items:center;pointer-events:none}
.stamp span{font-family:var(--f-display);font-size:40px;font-weight:700;color:var(--seal);border:4px solid var(--seal);border-radius:var(--r-lg);padding:10px 22px;background:color-mix(in srgb,var(--card) 80%,transparent);letter-spacing:.12em;animation:stamp 1.15s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-4deg)}22%{opacity:1;transform:scale(.94) rotate(-10deg)}32%{transform:scale(1.03) rotate(-10deg)}75%{opacity:1;transform:scale(1) rotate(-10deg)}100%{opacity:0;transform:scale(1) rotate(-10deg)}}

/* ---------- 按壓回饋 ---------- */
.has-rip{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.btn,.chip,.li,.opt,.lv-card,.remind,.te-card,.datebar .nav,.icon-btn{transition:transform .12s var(--ease),background .2s;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.btn:active,.chip:active,.opt:active,.lv-card:active,.remind:active,.te-card:active,.datebar .nav:active,.icon-btn:active{transform:scale(.96)}
.li:active{transform:scale(.99)}
nav.tabs button:active .ic{transform:scale(.9)}

@media (max-width:360px){.mk2{min-width:48px;padding:0 10px}.marks{gap:6px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const WD='日一二三四五六';
const wd=s=>parse(s).getDay();
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};
const mdw=s=>{const d=parse(s);return (d.getMonth()+1)+'月'+d.getDate()+'日'};
const mdwk=s=>md(s)+'（'+WD[wd(s)]+'）';
const money=n=>'NT$'+Math.round(n).toLocaleString('en-US');
const termEnd=(start,weeks)=>addDays(start,weeks*7-1);

/* ---------- storage ---------- */
const KEY='rollbook.v3';
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof CLOUD!=='undefined'&&CLOUD.user)cloudSchedule()}
let S;

/* ---------- 時段 ---------- */
const slot=id=>S.slots.find(x=>x.id===id);
const stu=id=>S.students.find(s=>s.id===id);
const slotText=sl=>sl?`週${WD[sl.wd]} ${sl.start}`:'未排時段';
const slotFull=sl=>{if(!sl)return '未排時段';const l=(S.levels||[]).find(x=>x.id===sl.level);return `週${WD[sl.wd]} ${sl.start}–${sl.end}${l?' '+l.name:''}${sl.name?' '+sl.name:''}`};
const isClosed=(d,sid)=>(S.closures||[]).some(c=>c.date===d&&(!c.slotId||c.slotId===sid));
const closureOf=(d,sid)=>(S.closures||[]).find(c=>c.date===d&&(!c.slotId||c.slotId===sid));
const slotsSorted=()=>S.slots.slice().sort((x,y)=>((x.wd+6)%7)-((y.wd+6)%7)||x.start.localeCompare(y.start));
// 學生在某天的固定時段（依調整生效日）
function slotOn(s,date){let cur=null;for(const h of s.slotHist||[])if(h.from<=date&&(!cur||h.from>=cur.from))cur=h;return cur?cur.slotId:null}
const curSlot=s=>slotOn(s,today())||((s.slotHist||[]).slice().sort((a,b)=>a.from.localeCompare(b.from)).pop()||{}).slotId;
// 學生在區間內應上的固定課
function sessions(s,from,to){
  const out=[];for(let d=from;d<=to;d=addDays(d,1)){const id=slotOn(s,d),sl=id&&slot(id);if(sl&&sl.wd===wd(d)&&!isClosed(d,id))out.push({date:d,key:id})}
  return out;
}
const regularOn=(date,key)=>isClosed(date,key)?[]:S.students.filter(s=>s.active&&slotOn(s,date)===key&&(slot(key)||{}).wd===wd(date));
const rec=(sid,date,key)=>S.records.find(r=>r.sid===sid&&r.date===date&&r.key===key);
const isRegular=(s,r)=>!r.mk&&slotOn(s,r.date)===r.key&&(slot(r.key)||{}).wd===wd(r.date);

/* ---------- 班級類別 ---------- */
const defaultLevels=()=>['塗鴉班','幼兒班','兒童班','進階班'].map((n,i)=>({id:uid(),name:n,tone:i}));
const level=id=>(S.levels||[]).find(l=>l.id===id);
const av=s=>{const l=level(s.level),n=s.name||'?',c=n.length>=3?n[1]:n.length===2?n[1]:n[0];return `<span class="av av${l?l.tone%6:5}" aria-hidden="true">${esc(c)}</span>`};
const lvTag=s=>{const l=level(s.level);return l?`<span class="lv lv${l.tone%6}">${esc(l.name)}</span>`:''};

/* ---------- 補課 ---------- */
function mkStatus(m){if(m.type==='credit')return 'credited';const r=S.records.find(x=>x.mk===m.id);if(r)return r.status==='present'?'done':'failed';if(isClosed(m.date,m.slotId))return 'closed';return m.date<today()?'overdue':'scheduled'}
const MK={scheduled:'已排定',overdue:'未點名',done:'已補',failed:'又沒來',credited:'折抵學費',closed:'遇到停課'};
// 沒來、還沒安排（或補課又沒來）的課
function pendingAbs(sid){
  return S.records.filter(r=>r.status==='absent'&&!r.mk&&(!sid||r.sid===sid)&&stu(r.sid)&&stu(r.sid).active)
   .filter(r=>!S.makeups.some(m=>m.absId===r.id&&mkStatus(m)!=='failed'))
   .sort((a,b)=>a.date.localeCompare(b.date));
}
const upcomingMk=()=>S.makeups.filter(m=>['scheduled','overdue','closed'].includes(mkStatus(m))&&stu(m.sid)).sort((a,b)=>a.date.localeCompare(b.date)||(slot(a.slotId)||{start:''}).start.localeCompare((slot(b.slotId)||{start:''}).start));

/* ---------- 堂數計算 ---------- */
// 剩餘堂數 = 已購 − 有到的堂數（正課、補課、加課都算），沒來不扣
function bal(sid,upTo,excl){
  upTo=upTo||'9999-12-31';let c=0,u=0;
  for(const p of S.purchases){if(p.sid!==sid||p.date>upTo)continue;if(excl&&p.termId===excl)continue;c+=+p.lessons}
  for(const r of S.records)if(r.sid===sid&&r.date<=upTo&&r.status==='present')u++;
  return c-u;
}
const termsSorted=()=>[...S.terms].sort((a,b)=>a.start.localeCompare(b.start));
const tEnd=t=>termEnd(t.start,t.weeks);
const termAt=d=>S.terms.find(t=>t.start<=d&&d<=tEnd(t));
const termById=id=>S.terms.find(t=>t.id===id);
function nextTerm(t){const ts=termsSorted();const i=ts.findIndex(x=>x.id===t.id);return i>=0?ts[i+1]:null}
// 下一期的堂數用學生目前的時段計算
function termLessons(s,t){const sl=slot(curSlot(s));if(!sl)return 0;let n=0;for(let d=t.start;d<=tEnd(t);d=addDays(d,1))if(wd(d)===sl.wd&&!isClosed(d,sl.id))n++;return n}
function termStats(sid,t){
  const s=stu(sid),end=tEnd(t),td=today();
  const sch=sessions(s,t.start,end);
  const c={total:sch.length,present:0,absent:0,makeup:0,extra:0,absentDates:[],makeupDates:[]};
  for(const r of S.records){if(r.sid!==sid||r.date<t.start||r.date>end)continue;
    if(r.mk){if(r.status==='present'){const m=S.makeups.find(x=>x.id===r.mk);if(m&&m.absId){c.makeup++;c.makeupDates.push(r.date)}else c.extra++}}
    else if(isRegular(s,r)){if(r.status==='present')c.present++;else{c.absent++;c.absentDates.push(r.date)}}
    else if(r.status==='present')c.extra++;}
  c.remaining=sch.filter(x=>x.date>=td&&!rec(sid,x.date,x.key)).length;
  c.absentDates.sort();c.makeupDates.sort();
  return c;
}
function carryInto(sid,T){
  const td=today();
  if(T.start<=td)return bal(sid,addDays(T.start,-1),T.id);
  let b=bal(sid,td,T.id);const cur=termAt(td);
  if(cur&&cur.id!==T.id)b-=termStats(sid,cur).remaining;
  // 已排定但還沒上的補課也會用掉堂數
  b-=S.makeups.filter(m=>m.sid===sid&&m.date<T.start&&mkStatus(m)==='scheduled').length;
  return b;
}
const pendBefore=(sid,T)=>pendingAbs(sid).filter(r=>r.date<T.start);
function renewal(s,T,keep=0,adj=0){const total=termLessons(s,T),carry=carryInto(s.id,T),need=Math.max(0,total-carry+keep);
  let closed=0;const sl=slot(curSlot(s));if(sl)for(let d=T.start;d<=tEnd(T);d=addDays(d,1))if(wd(d)===sl.wd&&isClosed(d,sl.id))closed++;
  return {total,carry,need,closed,adj,amount:need*T.price+adj}}
const balCls=b=>b<0?'bal-neg':b<=2?'bal-low':'bal-ok';

  const S0=S;S=D;

  const gen=t=>{const end=tEnd(t)<today()?tEnd(t):addDays(today(),-1);

    else D.purchases.push({id:uid(),sid:s.id,date:'2026-05-30',lessons:10,amount:4000,paid:true,paidDate:'2026-05-30',method:'現金',kind:'points',note:''})});

  gen(fa);

  S=S0;return D;
}

function topicOf(D,K){const T=termAt(D),sl=slot(K);if(!T||!T.topics||!sl||!T.topics[sl.level])return null;

const sessId=(d,k)=>d+'|'+k;
// 一個時段的點名名單：固定學生 + 補課/加課
function rosterOf(D,K){
  const out=regularOn(D,K).map(s=>({id:'r:'+s.id,s,tag:''}));
  if(isClosed(D,K))return [];
  for(const m of S.makeups)if(m.type!=='credit'&&m.date===D&&m.slotId===K&&stu(m.sid))out.push({id:'m:'+m.id,s:stu(m.sid),tag:m.absId?'補課':'加課',m});
  for(const r of S.records)if(r.date===D&&r.key===K&&!r.mk&&!out.find(o=>o.id==='r:'+r.sid)&&stu(r.sid)){const s=stu(r.sid);
    out.push({id:'r:'+r.sid,s,tag:isRegular(s,r)?(s.active?'':'已停用'):'加課'})}   // 停用學生的舊紀錄仍算正課
  // 還沒按「確認點名」的臨時補課／加課：只放在草稿，不寫入資料
  for(const m of UI.walkins[sessId(D,K)]||[])if(stu(m.sid))out.push({id:'m:'+m.id,s:stu(m.sid),tag:m.absId?'補課':'加課',m,draft:true});
  return out;
}
const savedRec=o=>o.m?S.records.find(x=>x.mk===o.m.id):rec(o.s.id,UI.date,UI.key);

  ${!locked&&ros.length?`<div class="confirm-bar">

    <button class="btn primary" onclick="App.confirmRoll()">${conf?'確認修改':'確認點名'}${dirty?' ●':''}</button></div>`:''}

  <p class="muted">按「到」或「沒來」後，記得按「確認點名」才會存檔、扣堂數。沒來的會進「調課」等你安排補課。</p></div>`;

/* 學生名單：依星期 → 時段（班級）→ 學生。學生歸在「今天生效」的固定時段（curSlot）。 */
function vStuWeek(act){
  const by={};for(const s of act){const k=curSlot(s)||'';(by[k]=by[k]||[]).push(s)}
  const slots=slotsSorted(),days=[1,2,3,4,5,6,0].filter(d=>slots.some(x=>x.wd===d));
  const pend=slots.filter(x=>x.wd==null||x.wd==='');const noSlot=(by['']||[]).concat(...act.filter(s=>{const k=curSlot(s);return k&&!slot(k)}).map(s=>[s]));
  const dayN=d=>slots.filter(x=>x.wd===d).reduce((n,x)=>n+(by[x.id]||[]).length,0);
  const todayWd=parse(today()).getDay();
  if(UI.swd===null||(UI.swd!=='x'&&!days.includes(UI.swd)))UI.swd=days.includes(todayWd)?todayWd:(days[0]??'x');
  const extra=pend.length||noSlot.length;
  const tabs=`<div class="wk-days">${days.map(d=>`<button class="${UI.swd===d?'on':''}${d===todayWd?' today':''}" onclick="App.swd(${d})"><b>${WD[d]}</b><small class="num">${dayN(d)} 人</small></button>`).join('')}${extra?`<button class="${UI.swd==='x'?'on':''}" onclick="App.swd('x')"><b>其他</b><small class="num">${pend.reduce((n,x)=>n+(by[x.id]||[]).length,0)+noSlot.length} 人</small></button>`:''}</div>`;
  const row=s=>{const b=bal(s.id),p=pendingAbs(s.id).length;return `<button class="li" onclick="App.openStu('${s.id}')">${av(s)}<div class="main"><div class="t">${esc(s.name)}</div>
    <div class="s">${s.plan==='points'?'點數制':'整期制'}${p?` · <span style="color:var(--amber)">待補 ${p}</span>`:''}</div></div>
    <div class="r"><span class="big ${balCls(b)}">${b}</span><span class="unit">堂</span></div></button>`};
  const sortN=a=>a.slice().sort((x,y)=>x.name.localeCompare(y.name,'zh-Hant'));
  const block=(x,list)=>{const open=UI.sslot===x.id||UI.sslot==='all',lv=level(x.level);
    return `<div class="card"><button class="li slot-head" onclick="App.sslot('${x.id}')" aria-expanded="${open}">
      <div class="slot-time num"><b>${esc(x.start)}</b><small>${esc(x.end||'')}</small></div>
      <div class="main"><div class="t">${lv?`<span class="lv lv${lv.tone%6}">${esc(lv.name)}</span>`:''} ${esc(x.name||'')}</div><div class="s">${list.length} 位學生</div></div>
      <span class="chev">${open?'▾':'▸'}</span></button>
      ${open?(list.length?sortN(list).map(row).join(''):'<div class="empty" style="padding:14px">這個時段還沒有學生</div>'):''}</div>`};
  let body;
  if(UI.swd==='x'){body=pend.map(x=>block(x,by[x.id]||[])).join('')+(noSlot.length?`<div class="card"><div class="li"><div class="main"><div class="t">沒有固定時段</div><div class="s">${noSlot.length} 位學生</div></div></div>${sortN(noSlot).map(row).join('')}</div>`:'')}
  else{const xs=slots.filter(x=>x.wd===UI.swd);body=xs.length?xs.map(x=>block(x,by[x.id]||[])).join(''):'<div class="card empty"><b>這天沒有課</b></div>'}
  return `${tabs}${days.length||extra?`<div class="row"><span class="muted">點時段看學生名單</span><span class="spacer"></span><button class="btn ghost sm" onclick="App.sslot('all')">${UI.sslot==='all'?'全部收起':'全部展開'}</button></div>`:''}
  ${days.length||extra?body:'<div class="card empty"><b>還沒有時段</b>到「設定 → 時段」新增每週的上課時段</div>'}`;
}

// 一週 = 週一到週日；人次 = 狀態為「到」的紀錄數（正課、補課、加課都算）
function weekStats(off){
  const t=today(),from=addDays(t,-((wd(t)+6)%7)+7*off),to=addDays(from,6);
  const days=[];let P=0,A=0,E=0,MK=0,lv={};
  for(let i=0;i<7;i++){const d=addDays(from,i);
    const rs=S.records.filter(r=>r.date===d);
    const p=rs.filter(r=>r.status==='present'),a=rs.filter(r=>r.status==='absent');
    let e=0;for(const sl of daySlots(d))e+=regularOn(d,sl.id).length;
    const closed=daySlots(d).length>0&&daySlots(d).every(sl=>isClosed(d,sl.id));
    for(const r of p){const s=stu(r.sid);if(r.mk||(s&&!isRegular(s,r)))MK++;const l=s&&level(s.level),n=l?l.name:'未分類';lv[n]=(lv[n]||0)+1}
    P+=p.length;if(d<=t){A+=a.length;E+=e}
    days.push({d,p:p.length,a:a.length,e,closed,future:d>t});
  }
  return {from,to,days,P,A,E,MK,lv};
}
// 本週沒到課明細：沒來的紀錄（含補課狀態）＋過去日子還沒點名的人
function weekAbsentData(W){
  const t=today(),rows=[],miss=[];
  for(const x of W.days){
    for(const r of S.records.filter(r=>r.date===x.d&&r.status==='absent')){const s=stu(r.sid);if(!s)continue;
      const sl=slot(r.key);let st,cls='wa-todo',act='';
      if(r.date>t){st='預先請假';cls='wa-pre'}
      const ms=S.makeups.filter(m=>m.absId===r.id);
      const cr=ms.find(m=>m.type==='credit'),done=ms.find(m=>mkStatus(m)==='done'),sch=ms.find(m=>['scheduled','overdue'].includes(mkStatus(m)));
      if(r.mk){st='補課沒來';cls='wa-todo'}
      else if(cr){st='已折抵學費';cls='wa-ok'}
      else if(done){st='已補 '+md(done.date);cls='wa-ok'}
      else if(sch){st='已排補課 '+md(sch.date)+' '+(slot(sch.slotId)||{}).start;cls='wa-sch'}
      else if(!st){st='待補課';act=r.id}
      rows.push({s,r,sl,st,cls,act});
    }
    if(x.d<t)for(const sl of daySlots(x.d)){if(isClosed(x.d,sl.id))continue;
      for(const s of regularOn(x.d,sl.id))if(!rec(s.id,x.d,sl.id))miss.push({s,d:x.d,sl})}
  }
  return {rows,miss};
}

/* ---------- 每月到課 ---------- */
const ymOf=d=>d.slice(0,7);
function monthStats(ym){
  const t=today(),[y,m]=ym.split('-').map(Number),last=new Date(y,m,0).getDate();
  let P=0,A=0,MK=0,E=0,U=0;const lv={},st={};
  const add=(s,k)=>{const o=st[s.id]=st[s.id]||{s,p:0,a:0,mk:0,u:0};o[k]++;const n=(level(s.level)||{}).name||'未分類';const l=lv[n]=lv[n]||{p:0,a:0,mk:0};if(k!=='u')l[k]++};
  for(let i=1;i<=last;i++){const d=`${ym}-${pad(i)}`;if(d>t)break;
    for(const r of S.records){if(r.date!==d)continue;const s=stu(r.sid);if(!s)continue;
      if(r.status==='present'){P++;add(s,'p');if(r.mk||!isRegular(s,r)){MK++;add(s,'mk')}}else{A++;add(s,'a')}}
    if(d<t)for(const sl of daySlots(d)){if(isClosed(d,sl.id))continue;for(const s of regularOn(d,sl.id)){E++;if(!rec(s.id,d,sl.id)){U++;add(s,'u')}}}
  }
  return {ym,P,A,MK,E,U,lv,st:Object.values(st)};
}

// 找出「目前這期 → 下一期」：期末前後各一段時間內都適用
function termEndPair(){
  const td=today(),ts=termsSorted();
  let T=termAt(td),N=T&&nextTerm(T);
  if(!T){const past=ts.filter(t=>tEnd(t)<td).pop();if(past){T=past;N=nextTerm(past)}}
  if(T&&N&&N.start<=td){T=null}
  // 新一期剛開始兩週內，仍可看上一期的清單
  if(!T){const cur=termAt(td),prev=cur&&ts[ts.findIndex(x=>x.id===cur.id)-1];if(prev&&addDays(cur.start,14)>=td){T=prev;N=cur}}
  return T&&N?{T,N}:null;
}
function termEndInfo(sel){
  const p=sel||termEndPair();if(!p)return null;const {T,N}=p;
  const rows=[];
  for(const s of S.students.filter(x=>x.active)){
    const abs=pendBefore(s.id,N);if(!abs.length)continue;
    const r=renewal(s,N),lv=level(s.level);

function rosterPlan(d,base){
  const lvByName=n=>base.levels.find(l=>l.name===n);
  const newLv=[...new Set([...(d.levels||[]),...d.students.map(s=>s.level),...d.slots.map(s=>s.level)].filter(Boolean))].filter(n=>!lvByName(n));
  const slotMatch=x=>base.slots.find(s=>s.wd===x.wd&&s.start===x.start&&((level(s.level)||{}).name||'')===(x.level||''));
  const newSlots=d.slots.filter(x=>!slotMatch(x));
  const names=new Set(base.students.filter(s=>s.active).map(s=>s.name));
  const newStu=d.students.filter(s=>!names.has(s.name)),skip=d.students.filter(s=>names.has(s.name));
  return {newLv,newSlots,newStu,skip,unsched:newStu.filter(s=>s.wd==null)};
}
function rosterImport(d){

function rosterApply(d,from){
  if(S.sample||App._rebuild===true)S={settings:S.settings,levels:S.levels,slots:[],terms:[],closures:[],students:[],purchases:[],records:[],makeups:[],confirmed:{}};App._rebuild=false;
  from=d.from||from;
  const P=rosterPlan(d,S);
  P.newLv.forEach(n=>S.levels.push({id:uid(),name:n,tone:S.levels.reduce((m,l)=>Math.max(m,l.tone),-1)+1}));
  const lvId=n=>(S.levels.find(l=>l.name===n)||{}).id||'';
  P.newSlots.forEach(x=>S.slots.push({id:uid(),wd:x.wd,start:x.start,end:x.end,name:x.name||'',level:lvId(x.level)}));
  const slotId=s=>(S.slots.find(x=>x.wd===s.wd&&x.start===s.start&&x.level===lvId(s.level))||{}).id;
  let T=null;
  if(d.term){T=S.terms.find(t=>t.name===d.term.name);if(!T){T={id:uid(),name:d.term.name,start:d.term.start,weeks:+d.term.weeks,price:+d.term.price};S.terms.push(T)}
    if(d.term.topics){T.topics={};for(const [n,arr] of Object.entries(d.term.topics)){const id=lvId(n);if(id)T.topics[id]=arr}}}
  P.cls=0;(d.closures||[]).forEach(c=>{if(!S.closures.some(x=>x.date===c.date&&!x.slotId)){S.closures.push({id:uid(),date:c.date,slotId:null,reason:c.reason||''});P.cls++}});
  P.bills=0;P.billAmt=0;P.upd=0;P.recs=0;
  const byName=n=>S.students.find(x=>x.active&&x.name===n);
  for(const s of d.students){
    const hist=s.slotHist?s.slotHist.map(h=>({from:h.from,slotId:slotId(h)})).filter(h=>h.slotId):(s.wd!=null&&slotId(s)?[{from,slotId:slotId(s)}]:[]);
    let st=byName(s.name);
    if(!st){st={id:uid(),name:s.name,level:lvId(s.level),plan:s.plan||'term',phone:s.phone||'',note:s.note||(s.wd==null?`${s.level||''} 時段待確認`:''),active:true,slotHist:hist};S.students.push(st)}
    else{const before=JSON.stringify([st.level,st.plan,st.slotHist]);
      st.level=lvId(s.level)||st.level;if(s.plan)st.plan=s.plan;
      if(hist.length&&(s.slotHist||curSlot(st)!==hist[hist.length-1].slotId))st.slotHist=hist;
      if(before!==JSON.stringify([st.level,st.plan,st.slotHist]))P.upd++}
    if(!T||!d.bill)continue;
    const mine=S.purchases.filter(p=>p.sid===st.id&&p.termId===T.id&&p.kind==='term');
    if(st.plan==='points'){
      S.purchases=S.purchases.filter(p=>!mine.includes(p));
      if(s.points&&!S.purchases.some(p=>p.sid===st.id&&p.src===d.id)){const q=s.points;
        S.purchases.push({id:uid(),sid:st.id,kind:'points',termId:null,lessons:q.lessons,amount:q.amount||0,adj:0,adjReason:'',date:q.date||T.start,paid:!!q.paid,paidDate:q.paid?(q.date||T.start):'',method:'',note:q.note||'',src:d.id})}
      continue}
    if(!st.slotHist.length)continue;
    const n=sessions(st,T.start,tEnd(T)).length,date=d.bill.date||T.start;
    const paid=!!d.bill.paid&&!(d.bill.unpaid||[]).includes(st.name);
    if(mine.length){const p=mine[0];p.lessons=n;p.amount=n*T.price+(+p.adj||0);if(paid&&!p.paid){p.paid=true;p.paidDate=date}
      S.purchases=S.purchases.filter(x=>x===p||!mine.includes(x))}
    else S.purchases.push({id:uid(),sid:st.id,kind:'term',termId:T.id,lessons:n,amount:n*T.price,adj:0,adjReason:'',date,paid,paidDate:paid?date:'',method:paid?(d.bill.method||''):'',note:'',src:d.id});
    P.bills++;P.billAmt+=n*T.price;if(!paid)P.unpaid=(P.unpaid||0)+1;
  }
  for(const r of d.records||[]){const st=byName(r.name),k=slotId(r);if(!st||!k)continue;
    if(rec(st.id,r.date,k))continue;
    S.records.push({id:uid(),sid:st.id,date:r.date,key:k,status:r.status});P.recs++;
    if(r.date<today())S.confirmed[r.date+'|'+k]=S.confirmed[r.date+'|'+k]||{at:Date.now()}}
  // 移除沒有學生、沒有紀錄的空時段（例如時間改了之後留下的舊時段）
  const used=new Set([...S.students.flatMap(s=>(s.slotHist||[]).map(h=>h.slotId)),...S.records.map(r=>r.key),...S.makeups.map(m=>m.slotId)]);
  S.slots=S.slots.filter(x=>used.has(x.id));
  return P;
}

/* ---------- 加密預設名單（GitHub 上的 seed.enc.json） ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptSeed(enc,pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
let seedEnc=null;
async function checkSeed(force){
  if(inFrame()||!window.crypto||!crypto.subtle)return;
  try{const r=await fetch('seed.enc.json',{cache:'no-store'});if(!r.ok)return;seedEnc=await r.json()}catch(e){return}
  if(!seedEnc||!seedEnc.id)return;
  const st=S.settings.seeds||{};
  if(!force&&(st[seedEnc.id]||App._seedShown===seedEnc.id))return;
  App._seedShown=seedEnc.id;
  seedSheet();
}

let ac=null;
function tick(f=760,dur=.07){
  if(!S||!S.settings||!S.settings.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}
}

const inFrame=()=>{try{return window.self!==window.top}catch(e){return true}};
async function saveFile(name,data,mime,preferLink){
  if(inFrame()){
    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
    if(!dl){toast('這裡無法下載檔案，請在主畫面的 App 使用');return false}
    try{await dl.save({filename:name,data:new Blob([data])});toast('已存檔');return true}
    catch(e){if(e&&e.code==='rejected_extension')toast('試用版不支援這種檔案，請在主畫面的 App 使用');else if(!e||e.code!=='declined')toast('沒有存成功，請再試一次');return false}
  }
  const blob=new Blob([data],{type:mime});
  if(!preferLink){try{const f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);return true;

/* ---------- 雲端同步（Firebase Firestore） ----------
   資料分段存：users/{uid}/parts/core（記錄以外的全部）與 users/{uid}/parts/r-YYYY-MM（每月點名紀錄）。
   每段有 rev（版本號）。上傳用 transaction：雲端 rev 和本機記得的 rev 不同，代表另一台裝置改過，
   就用「上次同步內容」做三方合併（同一筆兩邊都改，以這台為準；一邊刪除、另一邊沒改就刪除）。 */
const FB_VER='10.12.2';
const CLOUD={cfg:null,user:null,db:null,auth:null,status:'off',msg:'',timer:null,unsub:null,busy:false,again:false,remote:{},ready:false};
const CM_KEY='rollbook.cloud',CB_KEY='rollbook.cloud.base';
function lsGet(k,d){try{const t=localStorage.getItem(k);return t?JSON.parse(t):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let CM=lsGet(CM_KEY,{});          // {cfg, uid, email, base:{part:{rev,hash}}, lastSync, device}
let CB=lsGet(CB_KEY,{});          // {part: json}  上次同步時的內容，三方合併用
if(!CM.device){CM.device=Math.random().toString(36).slice(2,12);lsSet(CM_KEY,CM)}
const cmSave=()=>{lsSet(CM_KEY,CM);lsSet(CB_KEY,CB)};

function hashStr(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)}return (h>>>0).toString(36)+'.'+s.length}
function splitParts(st){
  const {records,...core}=st;const p={core:JSON.stringify(core)},m={};
  for(const r of records||[]){const k='r-'+r.date.slice(0,7);(m[k]=m[k]||[]).push(r)}
  for(const k in m)p[k]=JSON.stringify(m[k]);
  return p;
}
function joinParts(p){
  const core=JSON.parse(p.core||'{}');core.records=[];
  for(const k of Object.keys(p).sort())if(k.startsWith('r-'))core.records.push(...JSON.parse(p[k]||'[]'));
  return core;
}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const isIdArr=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&typeof x.id==='string');
// 三方合併：b=上次同步、l=這台、r=雲端
function merge3(b,l,r){
  if(same(l,r))return l;
  if(b!==undefined&&same(b,l))return r;
  if(b!==undefined&&same(b,r))return l;
  if(isIdArr(l)&&isIdArr(r)&&(b===undefined||isIdArr(b))){
    const B=new Map((b||[]).map(x=>[x.id,x])),L=new Map(l.map(x=>[x.id,x])),R=new Map(r.map(x=>[x.id,x]));
    const out=[];
    for(const x of l){const id=x.id;
      if(R.has(id))out.push(merge3(B.get(id),x,R.get(id)));
      else if(!(B.has(id)&&same(B.get(id),x)))out.push(x);}      // 雲端刪了、這台沒改 → 刪
    for(const x of r){const id=x.id;if(L.has(id))continue;
      if(!(B.has(id)&&same(B.get(id),x)))out.push(x);}             // 這台刪了、雲端沒改 → 刪
    return out;
  }
  if(isObj(l)&&isObj(r)&&(b===undefined||isObj(b))){
    const out={},keys=new Set([...Object.keys(l),...Object.keys(r)]),bb=b||{};
    for(const k of keys){const inL=k in l,inR=k in r,inB=k in bb;
      if(inL&&inR)out[k]=merge3(inB?bb[k]:undefined,l[k],r[k]);
      else if(inL){if(!(inB&&same(bb[k],l[k])))out[k]=l[k]}
      else if(!(inB&&same(bb[k],r[k])))out[k]=r[k];}
    return out;
  }
  return l;
}
function normalize(){

  S.levels=S.levels||defaultLevels();S.slots=S.slots||[];S.terms=S.terms||[];S.students=S.students||[];S.purchases=S.purchases||[];
  S.records=S.records||[];S.makeups=S.makeups||[];S.closures=S.closures||[];S.confirmed=S.confirmed||{};
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* 設定：貼上 Firebase 的 firebaseConfig（JS 物件或 JSON 都可以） */
function parseFbConfig(t){
  const o={};for(const m of String(t).matchAll(/["']?(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)["']?\s*:\s*["']([^"']+)["']/g))o[m[1]]=m[2];

const cloudCfg=()=>CM.cfg||window.FIREBASE_CONFIG||null;

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s)})}
async function fbInit(){
  if(CLOUD.ready)return true;const cfg=cloudCfg();if(!cfg)return false;
  try{
    if(!window.firebase||!firebase.firestore){const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
      if(!window.firebase)await loadScript(base+'firebase-app-compat.js');
      await Promise.all([loadScript(base+'firebase-auth-compat.js'),loadScript(base+'firebase-firestore-compat.js')]);}
    const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
    CLOUD.auth=app.auth();CLOUD.db=app.firestore();CLOUD.ready=true;
    CLOUD.auth.onAuthStateChanged(u=>onUser(u));

  }catch(e){setCloud('error','連不上雲端服務，請確認網路');return false}

function setCloud(st,msg){CLOUD.status=st;CLOUD.msg=msg||'';cloudBadge();if(UI.tab==='settings'&&$('#cloud-card'))$('#cloud-card').innerHTML=cloudCardInner()}
function cloudBadge(){const b=$('#cloud-ind');if(!b)return;const st=CLOUD.status;
  b.hidden=!cloudCfg();b.dataset.st=st;
  b.setAttribute('aria-label',{ok:'已同步',syncing:'同步中',offline:'離線，連線後會自動同步',error:'同步出錯',login:'尚未登入雲端',off:'雲端未開啟'}[st]||'')}
const partsCol=()=>CLOUD.db.collection('users').doc(CLOUD.user.uid).collection('parts');

async function onUser(u){
  if(CLOUD.unsub){CLOUD.unsub();CLOUD.unsub=null}
  CLOUD.user=u||null;CLOUD.remote={};
  if(!u){setCloud('login');return}
  if(CM.uid!==u.uid){CM.uid=u.uid;CM.base={};CB={};}
  CM.email=u.email;cmSave();
  setCloud('syncing');
  try{
    const qs=await partsCol().get();qs.forEach(d=>CLOUD.remote[d.id]=d.data());
    const hasRemote=Object.keys(CLOUD.remote).length>0,localEmpty=S.sample||!S.students.length;
    if(!hasRemote){if(!S.sample)await cloudPush(true);else setCloud('ok')}
    else if(localEmpty)takeRemote();
    else if(!Object.keys(CM.base||{}).length){firstLinkSheet();return}
    else{applyRemote();await cloudPush(true)}
    listen();
    setTimeout(()=>checkSeed(false),800);
  }catch(e){setCloud(navigator.onLine?'error':'offline',errMsg(e))}
}
function listen(){
  if(CLOUD.unsub)CLOUD.unsub();
  CLOUD.unsub=partsCol().onSnapshot(qs=>{qs.docChanges().forEach(c=>{if(c.type==='removed')delete CLOUD.remote[c.doc.id];else CLOUD.remote[c.doc.id]=c.doc.data()});applyRemote()},
    e=>setCloud('error',errMsg(e)));
}
// 雲端整份取代這台
function takeRemote(){
  const p={};for(const [k,v] of Object.entries(CLOUD.remote))p[k]=v.json;
  S=joinParts(p);normalize();saveLocal();
  CM.base={};CB={};for(const [k,v] of Object.entries(CLOUD.remote)){CM.base[k]={rev:v.rev,hash:hashStr(v.json)};CB[k]=v.json}
  CM.lastSync=Date.now();cmSave();render();setCloud('ok');toast('已載入雲端資料');
}
// 收到雲端新版本：這台沒改過的段落直接套用；改過的交給上傳時合併
function applyRemote(){
  const parts=splitParts(S),base=CM.base||(CM.base={});let changed=false,dirty=false;
  for(const [k,r] of Object.entries(CLOUD.remote)){
    const b=base[k]||{rev:0,hash:''},lh=hashStr(parts[k]??'[]'),rh=hashStr(r.json);
    if(r.rev<=b.rev)continue;
    if(lh===rh){base[k]={rev:r.rev,hash:rh};CB[k]=r.json;continue}
    if(lh===b.hash){parts[k]=r.json;base[k]={rev:r.rev,hash:rh};CB[k]=r.json;changed=true}
    else dirty=true;
  }
  if(changed){S=joinParts(parts);normalize();saveLocal();render();toast('已從雲端更新')}
  cmSave();
  if(dirty)cloudSchedule(300);else if(CLOUD.status!=='syncing')setCloud('ok');
}
function cloudSchedule(ms){if(!CLOUD.user)return;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(()=>cloudPush(),ms??1500)}
async function cloudPush(force){
  if(!CLOUD.user||S.sample)return;
  if(CLOUD.busy){CLOUD.again=true;return}
  if(!navigator.onLine){setCloud('offline');return}
  CLOUD.busy=true;setCloud('syncing');
  const fv=firebase.firestore.FieldValue;let merged=false;
  try{
    const parts=splitParts(S),base=CM.base||(CM.base={});
    for(const k of new Set([...Object.keys(parts),...Object.keys(base)])){
      const json=parts[k]??(k==='core'?'{}':'[]'),h=hashStr(json),b=base[k]||{rev:0,hash:''};
      if(h===b.hash&&!force)continue;
      const ref=partsCol().doc(k);
      const res=await CLOUD.db.runTransaction(async tx=>{
        const snap=await tx.get(ref),rd=snap.exists?snap.data():null,rrev=rd?rd.rev:0;
        let out=json;

/* 找畫紙四角（第二版）
   1. 縮到 256 像素，用照片四周的顏色當「桌面」（最多 3 種顏色，可處理格子桌巾）。
   2. 和桌面顏色差很多的地方 = 可能是畫紙，取最大的一塊，補洞。
   3. 在這塊的邊緣找 4 條最直的線（霍夫轉換），兩兩交叉 = 四個角。
      手擋住一角、紙被雜物碰到時，那段邊緣不直，不會影響其他三條邊。
   4. 回傳 {q:[左上,右上,右下,左下], conf:0~1}。conf 高才自動裁切，低的讓老師手動拖角。 */
function detectPaper(src){
  const S=256,k=Math.min(1,S/Math.max(src.width,src.height));
  const w=Math.max(8,Math.round(src.width*k)),h=Math.max(8,Math.round(src.height*k)),N=w*h;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');g.drawImage(src,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data;
  // 顏色特徵：亮度＋紅綠＋黃藍（對色差比 RGB 直接相減敏感）
  const F=new Float32Array(N*3);
  for(let i=0;i<N;i++){const r=d[i*4],gg=d[i*4+1],b=d[i*4+2];F[i*3]=(r+gg+b)/3;F[i*3+1]=(r-gg)*1.3;F[i*3+2]=((r+gg)/2-b)*1.3}
  // 1. 桌面顏色：邊框像素做 k-means（k=3）
  const m=Math.max(2,Math.round(Math.min(w,h)*.03)),B=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(x<m||y<m||x>=w-m||y>=h-m)B.push(y*w+x);
  let C=[0,.5,.95].map(t=>{const s=B.slice().sort((p,q)=>F[p*3]-F[q*3]);const i=s[Math.floor(t*(s.length-1))];return [F[i*3],F[i*3+1],F[i*3+2]]});
  let cnt=[0,0,0];
  for(let it=0;it<8;it++){const acc=C.map(()=>[0,0,0]);cnt=[0,0,0];
    for(const i of B){let bj=0,bd=1e9;for(let j=0;j<3;j++){const dd=(F[i*3]-C[j][0])**2+(F[i*3+1]-C[j][1])**2+(F[i*3+2]-C[j][2])**2;if(dd<bd){bd=dd;bj=j}}
      acc[bj][0]+=F[i*3];acc[bj][1]+=F[i*3+1];acc[bj][2]+=F[i*3+2];cnt[bj]++}
    C=C.map((c,j)=>cnt[j]?acc[j].map(v=>v/cnt[j]):c)}
  const bg=C.filter((c,j)=>cnt[j]>=B.length*.08);
  const dist=new Float32Array(N);let mx=0;
  for(let i=0;i<N;i++){let bd=1e9;for(const c of bg){const dd=Math.hypot(F[i*3]-c[0],F[i*3+1]-c[1],F[i*3+2]-c[2]);if(dd<bd)bd=dd}dist[i]=bd;if(bd>mx)mx=bd}
  // Otsu 自動門檻
  const hist=new Uint32Array(256),q8=new Uint8Array(N);
  for(let i=0;i<N;i++){const v=Math.min(255,Math.round(dist[i]/Math.max(1,mx)*255));q8[i]=v;hist[v]++}
  let sum=0;for(let t=0;t<256;t++)sum+=t*hist[t];let sB=0,wB=0,best=-1,thr=30;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=t*hist[t];const v=wB*wF*(sB/wB-(sum-sB)/wF)**2;if(v>best){best=v;thr=t}}
  thr=Math.max(thr,Math.round(10/Math.max(1,mx)*255));
  let M=new Uint8Array(N);for(let i=0;i<N;i++)M[i]=q8[i]>thr?1:0;
  // 形態學：先閉合（補小縫）
  const morph=(A,dil)=>{const T=new Uint8Array(N),O=new Uint8Array(N);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,a=A[i],l=x>0?A[i-1]:a,r=x<w-1?A[i+1]:a;T[i]=dil?(a|l|r):(a&l&r)}
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,a=T[i],u=y>0?T[i-w]:a,dn=y<h-1?T[i+w]:a;O[i]=dil?(a|u|dn):(a&u&dn)}return O};
  M=morph(morph(M,1),0);
  // 2. 最大的一塊（碰到邊框太多的扣分：那通常是桌面的一部分）
  const lab=new Int32Array(N).fill(-1),st=new Int32Array(N),comps=[];
  for(let s=0;s<N;s++){if(!M[s]||lab[s]>=0)continue;const id=comps.length;let n=0,edge=0,sp=0;st[sp++]=s;lab[s]=id;

      if(x>0&&M[p-1]&&lab[p-1]<0){lab[p-1]=id;st[sp++]=p-1}if(x<w-1&&M[p+1]&&lab[p+1]<0){lab[p+1]=id;st[sp++]=p+1}
      if(y>0&&M[p-w]&&lab[p-w]<0){lab[p-w]=id;st[sp++]=p-w}if(y<h-1&&M[p+w]&&lab[p+w]<0){lab[p+w]=id;st[sp++]=p+w}}
    comps.push({id,n,edge,score:n*(1-Math.min(.8,edge/(2*(w+h))*1.6))})}

  comps.sort((a,b)=>b.score-a.score);const cp=comps[0];
  if(cp.n<N*.03)return null;
  // 低門檻擴張：從這塊往外長到「只要和桌面有一點點不同」的相連像素（白紙放淺色桌、紙邊沒畫到的留白）
  {const bd=B.map(i=>dist[i]).sort((a,b)=>a-b);const lo=Math.max(4,bd[Math.floor(bd.length*.97)]*1.15);
   let sp=0;for(let i=0;i<N;i++)if(lab[i]===cp.id)st[sp++]=i;
   while(sp){const p=st[--sp],x=p%w,y=(p-x)/w;
     const tryp=j=>{if(lab[j]!==cp.id&&dist[j]>lo){lab[j]=cp.id;st[sp++]=j;cp.n++}};
     if(x>0)tryp(p-1);if(x<w-1)tryp(p+1);if(y>0)tryp(p-w);if(y<h-1)tryp(p+w)}

  // 補洞：從外面灌水，灌不到的就是這塊裡面
  const out=new Uint8Array(N);let sp=0;
  const push=i=>{if(!out[i]&&lab[i]!==cp.id){out[i]=1;st[sp++]=i}};
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
  while(sp){const p=st[--sp],x=p%w,y=(p-x)/w;if(x>0)push(p-1);if(x<w-1)push(p+1);if(y>0)push(p-w);if(y<h-1)push(p+w)}
  const R=new Uint8Array(N);let area=0;for(let i=0;i<N;i++)if(!out[i]){R[i]=1;area++}

  const E=[],isE=new Uint8Array(N);

    if(x===0||y===0||x===w-1||y===h-1||!R[i-1]||!R[i+1]||!R[i-w]||!R[i+w]){E.push(x,y);isE[i]=1}}

function cropSheet(){
  const c=WK.cur.c,x=WK.items[WK.cur.i];
  sheet(`<h2>調整裁切（第 ${WK.cur.i+1} 張）</h2>
  <p class="muted" style="margin-top:0">${x.found?'':'沒找到畫紙邊緣。'}拖動四個圓點對準畫紙的四個角。</p>
  <div class="crop" id="crop" style="aspect-ratio:${c.width}/${c.height};width:min(100%,calc(54vh*${(c.width/c.height).toFixed(4)}))"><canvas id="crop-cv"></canvas>
    <svg viewBox="0 0 ${c.width} ${c.height}" preserveAspectRatio="none"><polygon id="crop-pg" points=""/></svg>
    ${[0,1,2,3].map(i=>`<i class="crop-h" data-i="${i}"></i>`).join('')}<div class="loupe" id="loupe" hidden><canvas id="loupe-cv"></canvas></div></div>
  <div class="stack" style="margin-top:12px"><button class="btn primary block" onclick="App.wkEditDone(true)">用這個裁切</button>
  <div class="grid2"><button class="btn" onclick="App.wkEditDone(false)">不裁切，用整張</button><button class="btn danger" onclick="App.wkEditDel()">不要這張</button></div></div>`);
  const cv=$('#crop-cv'),k=Math.min(1,900/Math.max(c.width,c.height));cv.width=Math.round(c.width*k);cv.height=Math.round(c.height*k);cv.getContext('2d').drawImage(c,0,0,cv.width,cv.height);
  cropDraw();
  const box=$('#crop');
  const at=e=>{const r=box.getBoundingClientRect();return [Math.max(0,Math.min(c.width,(e.clientX-r.left)/r.width*c.width)),Math.max(0,Math.min(c.height,(e.clientY-r.top)/r.height*c.height))]};
  // 手指按在角附近就抓那個角，拖動時角跟著手指「相對移動」，手指不會蓋住角；同時顯示放大鏡
  const clamp=p=>[Math.max(0,Math.min(c.width,p[0])),Math.max(0,Math.min(c.height,p[1]))];
  let off=[0,0];
  box.onpointerdown=e=>{const p=at(e);let bi=0,bd=Infinity;WK.cur.quad.forEach((q,i)=>{const d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<bd){bd=d;bi=i}});
    WK.drag=bi;try{box.setPointerCapture(e.pointerId)}catch(x){}
    const r=box.getBoundingClientRect(),near=bd*r.width/c.width<44;
    if(near){off=[WK.cur.quad[bi][0]-p[0],WK.cur.quad[bi][1]-p[1]]}else{off=[0,0];WK.cur.quad[bi]=clamp(p)}
    cropDraw();loupeDraw();e.preventDefault()};
  box.onpointermove=e=>{if(WK.drag<0)return;const p=at(e);WK.cur.quad[WK.drag]=clamp([p[0]+off[0],p[1]+off[1]]);cropDraw();loupeDraw()};
  box.onpointerup=box.onpointercancel=()=>{WK.drag=-1;const l=$('#loupe');if(l)l.hidden=true};
}
// 放大鏡：把正在拖的角附近放大 3 倍，畫出裁切線和十字，放在不會被手指擋到的那一角
function loupeDraw(){
  const l=$('#loupe'),cv=$('#loupe-cv'),box=$('#crop');if(!l||!cv||!cv.getContext||WK.drag<0)return;
  const c=WK.cur.c,q=WK.cur.quad,p=q[WK.drag],r=box.getBoundingClientRect(),ds=r.width/c.width;
  const S=112,dpr=Math.min(3,window.devicePixelRatio||1),Z=3;
  cv.width=S*dpr;cv.height=S*dpr;const g=cv.getContext('2d');
  const half=S/2/(ds*Z),sx=p[0]-half,sy=p[1]-half,k=cv.width/(2*half);
  g.fillStyle='#777';g.fillRect(0,0,cv.width,cv.height);g.imageSmoothingQuality='high';
  g.drawImage(c,sx,sy,2*half,2*half,0,0,cv.width,cv.height);
  const T=v=>[(v[0]-sx)*k,(v[1]-sy)*k];
  g.lineJoin='round';
  for(const [w,col] of [[4*dpr,'rgba(0,0,0,.55)'],[2*dpr,'#fff']]){g.lineWidth=w;g.strokeStyle=col;g.beginPath();q.forEach((v,i)=>{const t=T(v);i?g.lineTo(t[0],t[1]):g.moveTo(t[0],t[1])});g.closePath();g.stroke()}
  const m=cv.width/2;g.strokeStyle='#e5484d';g.lineWidth=1.5*dpr;g.beginPath();g.moveTo(m-10*dpr,m);g.lineTo(m+10*dpr,m);g.moveTo(m,m-10*dpr);g.lineTo(m,m+10*dpr);g.stroke();
  // 放在手指的另一邊（角在左半 → 放右上；角在右半 → 放左上）
  const left=p[0]/c.width<.5;l.style.left=left?'auto':'8px';l.style.right=left?'8px':'auto';
  l.hidden=false}
function cropDraw(){const c=WK.cur.c,q=WK.cur.quad;const pg=$('#crop-pg');if(!pg||!pg.setAttribute)return;pg.setAttribute('points',q.map(p=>p.join(',')).join(' '));
  document.querySelectorAll('.crop-h').forEach(h=>{const p=q[+h.dataset.i];h.style.left=p[0]/c.width*100+'%';h.style.top=p[1]/c.height*100+'%'})}

// 刪掉一本相簿（先刪照片再刪相簿本身：權限規則要讀相簿的 owner 才能刪照片）
async function wkWipe(aid,onStep){const a=albumsCol().doc(aid),ph=await a.collection('photos').get(),ids=[];ph.forEach(d=>ids.push(d.id));
  for(let i=0;i<ids.length;i+=200){const bt=CLOUD.db.batch();for(const pid of ids.slice(i,i+200)){bt.delete(a.collection('photos').doc(pid));bt.delete(a.collection('full').doc(pid))}await bt.commit();if(onStep)onStep(Math.min(ids.length,i+200),ids.length)}
  await a.delete()}
async function wkRekeyDo(id){const s=stu(id);if(!s.album||WK.busy)return;WK.busy=true;
  const old=s.album,from=albumsCol().doc(old.aid),fv=firebase.firestore.FieldValue;let to=null;
  WK.total=1;WK.done=0;wkBusySheet('換密碼中…');
  const step=(d,t)=>{WK.done=d;WK.total=t||1;const pg=$('.wk-prog i');if(pg&&pg.style)pg.style.width=Math.round(d/(t||1)*100)+'%'};
  try{const code=newCode(),aid=await sha256(codeNorm(code));to=albumsCol().doc(aid);
    const ph=await from.collection('photos').get(),docs=[];ph.forEach(d=>docs.push(d));
    await to.set({owner:CLOUD.user.uid,name:s.name,level:(level(s.level)||{}).name||'',count:docs.length,updatedAt:fv.serverTimestamp()});
    // 一張一張搬：原圖每張接近 1MB，一次只送一張比較不會超過上限
    for(let i=0;i<docs.length;i++){const d=docs[i],f=await from.collection('full').doc(d.id).get(),bt=CLOUD.db.batch();
      bt.set(to.collection('photos').doc(d.id),d.data());if(f.exists)bt.set(to.collection('full').doc(d.id),f.data());await bt.commit();step(i+1,docs.length*2)}
    s.album={...old,code,aid,count:docs.length,rekeyAt:today(),oldAid:old.aid};save();
    try{await wkWipe(old.aid,(d,t)=>step(t+d,t*2));delete s.album.oldAid;save()}
    catch(e){toast('新密碼已啟用，但舊相簿沒刪乾淨，下次打開這位學生會再試一次')}
    WK.busy=false;WK.photos=null;if(WK.sid===id)wkLoad();render();App.wkShare(id);toast('已換新密碼，舊密碼已失效')}
  catch(e){WK.busy=false;
    // 搬到一半失敗：刪掉做到一半的新相簿，舊密碼照常可用
    if(to&&s.album.aid===old.aid){try{await wkWipe(to.id)}catch(x){}}
    closeSheet();toast('換密碼失敗，舊密碼仍可使用：'+errMsg(e))}}

async function wkPrep(files){
  WK.items=[];WK.total=files.length;WK.done=0;wkBusySheet('自動裁切中…');
  for(const f of files){
    try{const c=await fileToCanvas(f);let r=null;try{r=detectPaper(c)}catch(e){r=null}
      const x={f,quad:r?r.q:fullQuad(c),conf:r?r.conf:0,found:!!r,crop:true};x.prev=wkPrev(c,x);WK.items.push(x)}
    catch(e){toast(e.message||'讀不到這張照片')}
    WK.done++;const pg=$('.wk-prog i');if(pg&&pg.style)pg.style.width=Math.round(WK.done/WK.total*100)+'%';
    await new Promise(r=>setTimeout(r,0))}
  wkReview()}

  saveTerm(id){const d={name:$('#tf-name').value.trim(),start:$('#tf-start').value,weeks:Math.max(1,Math.round(+$('#tf-weeks').value||0)),price:+$('#tf-price').value||0};
    if(!d.name||!d.start||!+$('#tf-weeks').value){toast('請填寫名稱、開始日期與週數');return}
    if(id)Object.assign(termById(id),d);else S.terms.push({id:uid(),...d});save();closeSheet();render();toast('已儲存期別')},
  askDelTerm(id){confirmSheet('刪除這一期？繳費紀錄會保留，但不再對應到期別。','刪除',()=>{S.terms=S.terms.filter(t=>t.id!==id);S.purchases.forEach(p=>{if(p.termId===id)p.termId=null});save();render()})},
  set(k,v){S.settings[k]=v;save();render();toast('已儲存')},
  exportData(){const txt=JSON.stringify(S),box=$('#backup-box');const fb=()=>{box.value=txt;box.focus();box.select();toast('已顯示在下方，請長按複製')};
    try{navigator.clipboard.writeText(txt).then(()=>toast('已複製備份文字'),fb)}catch(e){fb()}},
  showBackup(){const box=$('#backup-box');box.value=JSON.stringify(S);box.focus();box.select()},
  downloadData(){saveFile('點名簿備份-'+today()+'.json',JSON.stringify(S),'application/json').then(ok=>{if(ok){S.settings.lastBackup=today();save()}})},
  askImport(){const t=$('#backup-box').value.trim();if(!t){toast('請先貼上備份文字');return}App._import(t)},
  importFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>App._import(r.result);r.readAsText(f)},
  _import(t){let d;try{d=JSON.parse(t)}catch(e){toast('備份格式不正確');return}
    if(d&&d.type==='rollbook-roster')return rosterImport(d);
    if(!d||!Array.isArray(d.students)||!Array.isArray(d.records)||!Array.isArray(d.slots)){toast('這不是點名簿的備份');return}
    confirmSheet(`還原 ${d.students.length} 位學生、${d.records.length} 筆點名紀錄？目前資料會被取代。`,'還原',()=>{S=d;S.settings=Object.assign({studio:'',unitPrice:400},S.settings);S.terms=S.terms||[];S.purchases=S.purchases||[];S.makeups=S.makeups||[];S.levels=S.levels||defaultLevels();S.confirmed=S.confirmed||{};S.closures=S.closures||[];save();render();toast('已還原')})},
  askReset(){confirmSheet('清除所有學生、點名、補課與繳費資料？時段和期別設定會保留。建議先備份。','全部清除',()=>{S={settings:S.settings,slots:S.slots,terms:S.terms,levels:S.levels,closures:S.closures||[],students:[],purchases:[],records:[],makeups:[],confirmed:{}};save();render()})},
  askClearSample(){confirmSheet('清除範例學生與紀錄，保留時段與期別設定，開始使用你自己的資料？','清除範例',()=>{S={settings:S.settings,slots:S.slots,terms:S.terms,levels:S.levels,closures:S.closures||[],students:[],purchases:[],records:[],makeups:[],confirmed:{}};save();UI.tab='students';render()},false)}
};
S=load()||seed();
normalize();
render();
cloudStart();
setTimeout(()=>{if(!CLOUD.user)checkSeed(false)},2500);
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body></html>
